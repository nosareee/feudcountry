<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;image-rendering:pixelated}
body{margin:0;min-height:100vh;font-family:"Handjet","Cairo",Tahoma,sans-serif;font-weight:800;font-size:22px;color:#fff;text-shadow:2px 2px 0 #3f3f3f;

h1,.no,.pts,.n,.bank,.strikes,#xo span{font-family:"Press Start 2P","Handjet",monospace;font-weight:400}
.wrap{max-width:1040px;margin:0 auto;padding:16px 12px 40px}
h1{margin:0 0 6px;text-align:center;font-size:clamp(1.2rem,5.5vw,2.5rem);color:#c6c6c6;letter-spacing:2px;direction:ltr;text-shadow:1px 1px #555,2px 2px #555,3px 3px #555,4px 4px #333,5px 5px #333,6px 6px #222}
.sub{text-align:center;color:#eee;margin:14px 0 14px}
button{font:inherit;font-size:1.05em;cursor:pointer;margin:4px;padding:6px 16px;color:#fff;text-shadow:2px 2px 0 #3f3f3f;background:#707070;border:3px solid;border-color:#b0b0b0 #373737 #373737 #b0b0b0;outline:3px solid #000;border-radius:0}
button:hover{background:#7f8bd8;border-color:#c0c8ff #3a4280 #3a4280 #c0c8ff}
button:active{border-color:#373737 #b0b0b0 #b0b0b0 #373737}
button.bad{background:#a33a3a;border-color:#e58a8a #5a1414 #5a1414 #e58a8a}
button.bad:hover{background:#c24a4a}
button.big{background:#4a8a2a;border-color:#9ee06a #234d12 #234d12 #9ee06a;font-size:1.25em;padding:6px 26px}
button.big.bad{background:#a33a3a;border-color:#e58a8a #5a1414 #5a1414 #e58a8a}
button:focus-visible,input:focus-visible,.slot:focus-visible{outline:3px solid #fff}
input{font:inherit;font-size:1em;width:100%;padding:6px 10px;border:2px solid #a0a0a0;border-radius:0;background:#000;color:#fff;text-shadow:none}
input::placeholder{color:#777}
.round{background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;outline:3px solid #000;padding:14px;margin:0 3px 22px;color:#3f3f3f;text-shadow:none}
.rh{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.arow{display:grid;grid-template-columns:30px 1fr 84px 44px;gap:8px;margin-bottom:8px;align-items:center}
.arow b{text-align:center}
.arow button{padding:4px 0}
.round button.ghost{color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.score{display:flex;gap:18px;justify-content:center;margin:0 0 16px;flex-wrap:wrap}
.tip,.team,.q{background:#100010;box-shadow:0 0 0 3px #100010,inset 0 0 0 3px #2a0a7a,inset 0 0 0 6px #100010}
.team{min-width:160px;padding:10px 18px;text-align:center}
.team input{text-align:center;padding:2px;border:0;background:transparent;color:#fff;text-shadow:2px 2px 0 #3f3f3f}
.team .n{font-size:1.2rem;color:#ffaa00;text-shadow:3px 3px 0 #3f2a00;margin-top:4px}
.q{margin:0 4px 16px;padding:14px 16px;text-align:center;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.2}
.meta{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 4px}
.bank{color:#ffaa00;font-size:1rem;text-shadow:3px 3px 0 #3f2a00}
.strikes{color:#ff5555;font-size:1.3rem;letter-spacing:2px;text-shadow:3px 3px 0 #3f1515}
.hint{color:#e8e8e8;text-align:center;font-size:1rem}
.board{direction:ltr;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,clamp(56px,12.5vw,108px));grid-auto-flow:column;gap:clamp(3px,.8vw,6px);padding:clamp(6px,1.4vw,12px);margin:0 4px;background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;outline:3px solid #000}
.slot{border:3px solid;border-color:#373737 #fff #fff #373737;background:#8b8b8b;cursor:pointer;-webkit-tap-highlight-color:transparent}
.slot.empty{cursor:default}
.in{position:relative;height:100%;overflow:hidden;background:#100010}
.front,.back{position:absolute;inset:0}
.front{display:grid;place-items:center;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAABAUlEQVR4nE1SwbEFIQjjOXuHCqADattKtjg6wAqkg3/In4wXRyGQEPy97ysi5xwREREz49PMVFVEuhtxEXkQYkJVuzsikO7uzMzMvTcwCyC2V9XMRBkqZ6aq3F1EZuaJiKoSkYhQ1ZkBIZ5VZWZgcHdVfZADAwv23tSDiLvj8lAcGCEDAlQVWdSfc8xsAX0rAcPdGGL+XepuDMALcewCHqSWmXEGUkEDvOJsOBd2hAR6E0E0Unvvc85i+4igxVgOImBzd7Re3U2tnAEn58Y9Isxs3eqBuMel1xS86Cb/yDlHVe9B+fNm5uGOKSMzqwrrwxKAwXi/7/tuDdwrzYEH9OYPO6HoGOtd++wAAAAASUVORK5CYII=) 0 0/48px 48px #7f7f7f;transform-origin:50% 100%;z-index:2}
.empty .front{background-color:#8b8b8b;background-image:none}
.no{font-size:clamp(1.1rem,4.4vw,2.4rem);color:#fff;text-shadow:3px 3px 0 #3f3f3f}
.back{display:flex;direction:ltr;background:#100010;box-shadow:inset 0 0 0 3px #2a0a7a,inset 0 0 0 6px #100010}
.pts{flex:0 0 18%;display:grid;place-items:center;margin:6px 0 6px 6px;border-right:3px solid #2a0a7a;color:#ffaa00;font-size:clamp(.8rem,3.4vw,1.9rem);text-shadow:3px 3px 0 #3f2a00}
.ans{flex:1;display:flex;align-items:center;direction:rtl;padding:0 clamp(10px,2.2vw,24px);font-size:clamp(1.4rem,5vw,2.8rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.open .front{animation:roll .42s steps(6,end) forwards}
.slot.open .back{animation:settle .42s steps(5,end)}
.slot.open.static .front{animation:none;transform:scaleY(0)}
.slot.open.static .back{animation:none}
@keyframes roll{to{transform:scaleY(0)}}
@keyframes settle{0%{transform:scaleY(1.3);opacity:.4}100%{transform:none;opacity:1}}
#xo{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);z-index:9;pointer-events:none}
#xo.on{display:grid}
#xo span{font-size:min(40vw,40vh);color:#ff5555;text-shadow:.07em .07em 0 #3f1515;line-height:1}
@media(prefers-reduced-motion:reduce){.slot.open .front,.slot.open .back{animation-duration:.01s}}
</style>
</head>

function snd(k,delay){const a=SND[k];setTimeout(()=>{try{a.currentTime=0;a.play().catch(()=>{});}catch(e){}},delay||0);}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mode="setup";
let rounds=[{q:"",a:[{t:"",p:""},{t:"",p:""},{t:"",p:""}]}];
let G={i:0,open:[],strikes:0,bank:0,sc:[0,0],names:["الفريق 1","الفريق 2"]};

function setup(){
  mode="setup";
  $("#sub").textContent="اكتب الأسئلة والإجابات، وبعدها اضغط ابدأ اللعبة";
  $("#app").innerHTML=rounds.map((r,ri)=>`
    <div class="round">
      <div class="rh">
        <input data-q="${ri}" value="${esc(r.q)}" placeholder="السؤال ${ri+1}: مثلاً شنو أشهر أكلة عراقية؟">
        ${rounds.length>1?`<button class="bad" data-act="delr" data-r="${ri}">حذف</button>`:""}
      </div>
      ${r.a.map((x,ai)=>`
        <div class="arow">
          <b>${ai+1}</b>
          <input data-t="${ri}.${ai}" value="${esc(x.t)}" placeholder="الإجابة ${ai+1}">
          <input data-p="${ri}.${ai}" value="${esc(x.p)}" inputmode="numeric" placeholder="النقاط">
          <button data-act="dela" data-r="${ri}" data-a="${ai}" title="حذف الإجابة">X</button>
        </div>`).join("")}
      ${r.a.length<8?`<button class="ghost" data-act="adda" data-r="${ri}">+ إجابة</button>`:""}
    </div>`).join("")+`
    <div class="bar">
      <button class="ghost" data-act="addr">+ سؤال جديد</button>
      <button class="big" data-act="start">ابدأ اللعبة</button>
    </div>
    <p class="hint">إذا تركت النقاط فارغة، تنعطى تلقائياً حسب الترتيب (الأعلى أكثر نقاط).</p>`;
}

function clean(){
  return rounds.filter(r=>r.q.trim()&&r.a.some(x=>x.t.trim())).map(r=>{
    const a=r.a.filter(x=>x.t.trim());
    return {q:r.q.trim(),a:a.map((x,i)=>({t:x.t.trim(),p:parseInt(x.p)||(a.length-i)*10}))};
  });
}

function start(){
  if(!clean().length){alert("اكتب سؤال وإجابة واحدة على الأقل");return;}
  G={i:0,open:[],strikes:0,bank:0,sc:[0,0],names:G.names};
  play();
}

function play(){
  mode="play";
  const c=clean(),r=c[G.i];
  $("#sub").textContent=`السؤال ${G.i+1} من ${c.length}`;
  let slots="";
  for(let i=0;i<8;i++){
    const x=r.a[i];
    if(!x){slots+=`<div class="slot empty"><div class="in"><div class="front"></div></div></div>`;continue;}
    const o=G.open.includes(i);
    slots+=`<div class="slot${o?" open static":""}" id="s${i}" data-act="slot" data-i="${i}" role="button" tabindex="0" aria-label="الإجابة ${i+1}">
      <div class="in"><div class="back"><div class="pts">${x.p}</div><div class="ans">${esc(x.t)}</div></div>
      <div class="front"><div class="no">${i+1}</div></div></div></div>`;
  }
  $("#app").innerHTML=`
    <div class="score">${[0,1].map(t=>`
      <div class="team"><input data-n="${t}" value="${esc(G.names[t])}" aria-label="اسم الفريق"><div class="n">${G.sc[t]}</div></div>`).join("")}
    </div>
    <div class="q">${esc(r.q)}</div>
    <div class="board">${slots}</div>
    <div class="meta"><span>رصيد الجولة: <span class="bank" id="bank">${G.bank}</span></span><span class="strikes" id="str">${"X ".repeat(G.strikes)}</span></div>
    <div class="bar">
      <button class="bad big" data-act="strike">خطأ</button>
      <button data-act="give" data-t="0">النقاط لـ ${esc(G.names[0])}</button>
      <button data-act="give" data-t="1">النقاط لـ ${esc(G.names[1])}</button>
      <button class="ghost" data-act="all">اكشف الكل</button>
      <button class="ghost" data-act="next">${G.i<c.length-1?"السؤال التالي":"إنهاء"}</button>
      <button class="ghost" data-act="edit">تعديل الأسئلة</button>
    </div>
    <p class="hint">اضغط على رقم الإجابة الصحيحة لتنكشف، وإذا غلط اضغط زر خطأ (أو حرف X). تقدر تستخدم الأرقام 1 إلى 8 من الكيبورد.</p>`;
}

function reveal(i,quiet){
  if(mode!=="play")return;
  const r=clean()[G.i];if(!r.a[i]||G.open.includes(i))return;
  G.open.push(i);G.bank+=r.a[i].p;
  const s=$("#s"+i);if(s)s.classList.add("open");
  $("#bank").textContent=G.bank;
  if(!quiet)snd("ding",250);
}
function strike(){
  if(mode!=="play")return;
  G.strikes=Math.min(3,G.strikes+1);
  $("#str").innerHTML="X ".repeat(G.strikes);
  snd("wrong");
  const x=$("#xo");x.classList.add("on");setTimeout(()=>x.classList.remove("on"),1100);
}

document.addEventListener("input",e=>{
  const d=e.target.dataset;
  if(d.q!==undefined)rounds[+d.q].q=e.target.value;
  else if(d.t!==undefined){const[r,a]=d.t.split(".");rounds[+r].a[+a].t=e.target.value;}
  else if(d.p!==undefined){const[r,a]=d.p.split(".");rounds[+r].a[+a].p=e.target.value;}
  else if(d.n!==undefined)G.names[+d.n]=e.target.value;
});
document.addEventListener("change",e=>{if(e.target.dataset.n!==undefined&&mode==="play")play();});
document.addEventListener("keydown",e=>{
  if(mode!=="play"||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(/^[1-8]$/.test(e.key)){reveal(+e.key-1);}
  else if(e.key==="x"||e.key==="X"||e.key==="ء"){strike();}
  else if((e.key==="Enter"||e.key===" ")&&e.target.dataset.act==="slot"){e.preventDefault();reveal(+e.target.dataset.i);}
});

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const d=b.dataset,act=d.act,c=mode==="play"?clean():null;
  if(act==="adda"){rounds[+d.r].a.push({t:"",p:""});setup();}
  else if(act==="dela"){rounds[+d.r].a.splice(+d.a,1);if(!rounds[+d.r].a.length)rounds[+d.r].a.push({t:"",p:""});setup();}
  else if(act==="addr"){rounds.push({q:"",a:[{t:"",p:""},{t:"",p:""},{t:"",p:""}]});setup();}
  else if(act==="delr"){rounds.splice(+d.r,1);setup();}
  else if(act==="start"||act==="again")start();
  else if(act==="edit")setup();
  else if(act==="slot")reveal(+d.i);
  else if(act==="strike")strike();
  else if(act==="give"){G.sc[+d.t]+=G.bank;G.bank=0;play();}
  else if(act==="all"){c[G.i].a.forEach((_,i)=>reveal(i,true));}
  else if(act==="next"){
    if(G.i<c.length-1){G.i++;G.open=[];G.strikes=0;G.bank=0;play();}
    else{
      const[a,b2]=G.sc;
      mode="end";
      $("#sub").textContent="انتهت اللعبة";
      $("#app").innerHTML=`<div class="q">${a===b2?"تعادل!":"الفائز: "+esc(G.names[a>b2?0:1])}</div>
      <div class="score">${[0,1].map(t=>`<div class="team"><div>${esc(G.names[t])}</div><div class="n">${G.sc[t]}</div></div>`).join("")}</div>
      <div class="bar"><button class="big" data-act="again">العب مرة ثانية</button><button class="ghost" data-act="edit">تعديل الأسئلة</button></div>`;
    }
  }
});
setup();
</script>
</body>
</html>
